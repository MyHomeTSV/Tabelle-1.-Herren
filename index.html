<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>TSV Großenkneten - 1.Herren</title>
  <script type="text/javascript" src="https://www.fussball.de/widgets.js"></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #ffffff;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    html, body, #viewport, #shifter {
      overflow-anchor: none;
    }
    :root {
      --crop-top: 0px;
      --zoom: 1.6; /* 1.0 = normale Größe, 1.3 = 30% größer usw. */
    }
    #viewport {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      position: relative;
    }
    #shifter {
      position: absolute;
      top: calc(-1 * var(--crop-top));
      left: 0;
      width: 100%;
      /* transition: top 1s ease-in-out;  <- diese Zeile entfernen/auskommentieren */
    }
    }
    .fussballde_widget {
      width: 100% !important;
      zoom: var(--zoom);
    }
  </style>
</head>
<body>
  <div id="viewport">
    <div id="shifter">
      <div
      class="fussballde_widget"
      data-id="35cadcca-1b8a-420c-ab73-1cd44c8b7cc6"
      data-type="table"
        style="width: 100%"
      ></div>
    </div>
  </div>

<script>
  if ("scrollRestoration" in history) {
    history.scrollRestoration = "manual";
  }
  function forceTop() {
    window.scrollTo(0, 0);
    document.documentElement.scrollTop = 0;
    document.body.scrollTop = 0;
  }
  window.addEventListener("scroll", forceTop, true);
  forceTop();

  (function () {
    var initialDelay = 3000;    // Wartezeit bis zum ersten Scrollen (ms)
    var scrollDuration = 15000; // Zeit für den kompletten Weg von oben nach unten (ms) → 20 Sek.
    var pauseAtBottom = 2000;   // Wartezeit unten, bevor es zurück nach oben geht (ms)
    var pauseAtTop = 3000;      // Wartezeit oben, bevor der Zyklus neu beginnt (ms)

    function setCrop(px) {
      document.documentElement.style.setProperty("--crop-top", px + "px");
    }

    function animate(from, to, duration, onDone) {
      var startTime = null;
      function step(timestamp) {
        if (!startTime) startTime = timestamp;
        var elapsed = timestamp - startTime;
        var progress = Math.min(elapsed / duration, 1);
        setCrop(from + (to - from) * progress);
        if (progress < 1) {
          requestAnimationFrame(step);
        } else {
          onDone();
        }
      }
      requestAnimationFrame(step);
    }

    function cycle() {
      var shifter = document.getElementById("shifter");
      var maxCrop = shifter.scrollHeight - window.innerHeight;
      if (maxCrop < 0) { maxCrop = 0; }

      animate(0, maxCrop, scrollDuration, function () {
        setTimeout(function () {
          setCrop(0);
          setTimeout(cycle, pauseAtTop);
        }, pauseAtBottom);
      });
    }

    setTimeout(cycle, initialDelay);
  })();
</script>
</body>
</html>
